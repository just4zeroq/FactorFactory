[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "factorfactory"
version = "5.0.0"
description = "声明式加密因子挖掘流水线：口径唯一、判据不可放宽、结论可复现"
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [{ name = "just4zeroq" }]
keywords = ["quant", "crypto", "factor-mining", "backtest", "research"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Topic :: Office/Business :: Financial :: Investment",
    "Operating System :: OS Independent",
]

# 运行时依赖的唯一来源是 requirements.txt（其中再引用 v5/requirements.txt）。
# 这里只声明「不装就无法 import」的最小集合，带版本约束的完整清单在那两份文件里，
# 因为 ml4t-backtest 必须从 git 固定 commit 安装，PEP 508 直接写会让 pip 每次解析。
dependencies = []

[project.urls]
Homepage = "https://github.com/just4zeroq/FactorFactory"
Documentation = "https://github.com/just4zeroq/FactorFactory/blob/main/docs/architecture/v5/INDEX.md"

[tool.setuptools.packages.find]
include = ["v5*"]
exclude = ["tests*", "docs*"]

[tool.setuptools.package-data]
v5 = [
    "contracts/plan_schema.json",
    "capability/registry/*.json",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
# 免安装即可跑测试：pytest 把仓库根加进 sys.path。
pythonpath = ["."]
addopts = "-q --strict-markers"
